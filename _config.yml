# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
title: Sitong Zhang
first_name: Sitong
last_name: Zhang
email: sitongzoe@gmail.com
description: >
  Postdoc at Aalto working on runtime systems for distributed RL and LLM post-training.
  Background in deep RL. Open-source side projects around AI coding agents and
  personal audio pipelines.
lang: en
icon:

url: https://RealZST.github.io
baseurl:

# -----------------------------------------------------------------------------
# Layout / theme
# -----------------------------------------------------------------------------
max_width: 1120px

# -----------------------------------------------------------------------------
# Social (used by _includes/footer.liquid)
# -----------------------------------------------------------------------------
github_username: RealZST
scholar_userid: Fv1FPy0AAAAJ
linkedin_username: sitong-zhang-303687286

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  news:
    output: false
  projects:
    output: true
    permalink: /projects/:path/
  notes:
    output: true
    permalink: /notes/:path/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "note"

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-scholar
  - jekyll-feed
  - jekyll-sitemap

# -----------------------------------------------------------------------------
# jekyll-scholar
# -----------------------------------------------------------------------------
scholar:
  last_name: Zhang
  first_name: [Sitong]
  style: _bibliography/acm.csl
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  replace_strings: true
  sort_by: year
  order: descending
  query: "@*"

# -----------------------------------------------------------------------------
# Exclude
# -----------------------------------------------------------------------------
include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - docs/
  - .superpowers/
  - node_modules/
  - target/
